name: scrape values

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-scraper.txt
      - run: python scraper.py
      - name: commit if changed
        run: |
          git config user.name "values-bot"
          git config user.email "values-bot@users.noreply.github.com"
          git add data/values.json
          git diff --cached --quiet || (git commit -m "update values" && git push)
